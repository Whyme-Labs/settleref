name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settleref-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CI: 'true'
      ARC_FOUNDRY_VERSION: v0.8.0-2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Record runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          {
            printf 'runner=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'repository=%s\ncommit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            node --version
            npm --version
          } | tee evidence/ci/source-and-runner.txt

      - name: Install application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test and build application
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee evidence/ci/application-tests.txt
          npm run typecheck 2>&1 | tee evidence/ci/typecheck.txt

      - name: Install checksum-pinned Arc Foundry
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/settleref-arc-foundry-$ARC_FOUNDRY_VERSION"
          rm -rf "$destination"
          bash scripts/install-arc-foundry.sh "$destination"
          echo "$destination" >> "$GITHUB_PATH"

      - name: Prove Arc profile selection
        shell: bash
        run: |
          set -euo pipefail
          arc-forge --version | tee evidence/ci/arc-foundry-version.txt
          arc-forge config --json > evidence/ci/foundry-default-config.json
          FOUNDRY_PROFILE=arc arc-forge config --json > evidence/ci/foundry-arc-config.json
          node --input-type=module - <<'NODE' | tee evidence/ci/arc-profile-check.txt
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('evidence/ci/foundry-arc-config.json', 'utf8'));
          if (config.network !== 'arc') {
            throw new Error(`Arc profile did not select Arc execution semantics: ${JSON.stringify(config.network)}`);
          }
          const hardfork = config.arc_hardfork ?? config.hardfork;
          const normalizedHardfork = String(hardfork).toLowerCase().replace(/^arc:/, '');
          if (normalizedHardfork !== 'zero8') {
            throw new Error(`Arc profile did not pin zero8: ${JSON.stringify(hardfork)}`);
          }
          console.log(`Arc profile active: network=${config.network}, hardfork=${hardfork}`);
          NODE

      - name: Test standard EVM logic
        shell: bash
        run: |
          set -euo pipefail
          arc-forge test -vvv 2>&1 | tee evidence/ci/contracts-standard.txt

      - name: Test Arc execution semantics
        shell: bash
        run: |
          set -euo pipefail
          FOUNDRY_PROFILE=arc arc-forge test -vvv 2>&1 | tee evidence/ci/contracts-arc.txt

      - name: Check browser ABI constants
        shell: bash
        run: |
          set -euo pipefail
          FORGE_BIN=arc-forge node scripts/check-abi.mjs 2>&1 | tee evidence/ci/abi-check.txt

      - name: Confirm verification did not rewrite tracked sources
        run: git diff --exit-code

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SettleRef verification'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Arc Foundry: \`$ARC_FOUNDRY_VERSION\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo
            echo 'The complete command output remains in the immutable job log. Artifact upload is intentionally omitted because the organization storage quota is exhausted.'
          } >> "$GITHUB_STEP_SUMMARY"

# Live-chain smoke tests remain owner-operated because they move USDC.
